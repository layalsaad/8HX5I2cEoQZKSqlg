[project]
name = "happiness"
version = "0.1.0"
description = "Predict customer happiness from delivery survey answers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "pytest>=8.3",
    "ruff>=0.6",
    "scipy>=1.13",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
